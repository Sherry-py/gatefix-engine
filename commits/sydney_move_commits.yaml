# commits/sydney_move_commits.yaml —— 悉尼远程退租案例（case=sydney_move）的 commit 点定义
# 数据来源：私人案例笔记（未发表，非论文）第5节"Commit Gates"表 + 案例后期新增的空运纸箱事件
#
# 每个 commit 定义：
#   cost_reverse: 撤销这个动作的成本（inf = 完全不可逆）
#   value:        这个动作本身的价值/涉及金额（用于 IsCommit 的 λ·Value 判定，单位：AUD 等价）
#   cost_fix:     一旦出错，修复成本（用于 on/in-loop 划界）
#   precondition_fn: preconditions/sydney_move.py 里对应的打分函数名
#   bypass_to_human: 证据人情类、机器不可组装，直接旁路给人，不进入 4D-CQ 计算
#   soft_commit: 软 commit（expectation-setting speech act），走 expectation_gate 而不是 quality_score
#   risk_ext: 外部或有闸门（如有），Commit=True 之后仍未清零的残余风险
#   requires: 跨 commit 依赖（这些 commit id 必须先在 SandboxWorld 里执行过）——
#             只被 agent/two_arm_experiment.py::check_sequence_precondition 读取，
#             engine.py / resolve_precondition 完全不读这个字段，不影响现有判定

commits:

  - id: discard_items
    name_cn: "扔弃物品"
    irreversibility: "物品不可恢复"
    cost_reverse: inf
    value: 50
    cost_fix: 0
    precondition_fn: score_discard_items

  - id: physical_handover
    name_cn: "实物交割（家电出门）"
    irreversibility: "交割即终"
    cost_reverse: inf
    value: 100
    cost_fix: 0
    precondition_fn: score_physical_handover

  - id: key_to_building_manager
    name_cn: "钥匙移交楼管（Building Manager）"
    irreversibility: "失去直接控制"
    cost_reverse: 50
    value: 200
    cost_fix: 30
    precondition_fn: score_key_to_building_manager
    requires: [discard_items]

  - id: key_to_agent
    name_cn: "钥匙移交中介（终极 commit）"
    irreversibility: "失去物理访问权，一切遗漏无法补救"
    cost_reverse: inf
    value: 5000
    cost_fix: 0
    precondition_fn: score_key_to_agent
    requires: [discard_items, physical_handover]

  - id: bond_claim_confirm
    name_cn: "Bond claim 确认"
    irreversibility: "资金结算"
    cost_reverse: 500
    value: 3000
    cost_fix: 200
    precondition_fn: score_bond_claim
    requires: [key_to_building_manager, key_to_agent]

  - id: friend_compensation
    name_cn: "对朋友的分账承诺与补偿"
    irreversibility: "承诺无法无痕撤回；补偿一旦支付且社交效果一次成型"
    cost_reverse: inf
    value: 1000
    cost_fix: 0
    # 两阶段合成一个 commit，因为现实里是同一件事：委托人先对朋友承诺按比例
    # 分账（旧物一起卖），承诺本身走 expectation_gate 预检（precondition_fn）；
    # 后来短期卖不掉、只能免费挂网找人一次性搬走，分账落空，改成现金+实物
    # 结清——这个实付决定人情类证据机器不可组装，最终必须走 bypass_to_human。
    # precondition_fn 在这里只是承诺阶段的预检，不影响、也不能替代最终必须
    # 人终审这件事（mcp_server/server.py 里专门有测试保证这条不会被绕开）。
    precondition_fn: score_expectation_setting
    bypass_to_human: true
    bypass_reason: "人情类证据机器不可组装（关系深浅/对方性格/开口语气不在 API 中）；precondition_fn 只是承诺阶段的预检，不代表最终补偿可以被自动授权"

  - id: air_freight_dispatch
    name_cn: "空运纸箱交运（加固决策）"
    irreversibility: "交运后途中损坏不可逆，只能靠加固降低概率、不能消除"
    cost_reverse: inf
    value: 17100
    cost_fix: 0
    precondition_fn: score_air_freight_dispatch
    risk_ext:
      p_inspect: 0.15
      loss_if_inspected: 1240
      note: "海关抽查是概率性事件，agent 不可控；触发后的损失可被证据质量（如实申报+凭证）压低，不能靠改数字降低"
