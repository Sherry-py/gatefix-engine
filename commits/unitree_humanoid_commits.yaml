# commits/unitree_humanoid_commits.yaml —— 宇树科技（688836.SH，2026-08-19 科创板上市）
# 人形机器人公开场景执行事故（case=unitree_humanoid）的 commit 点定义
#
# 如实说明——这份 case 和 cross_border_transfer 性质不同：不是从一个真实法律判例
# 反推出的假设性场景，是直接对两起已被多家媒体公开报道的真实事故做 commit-gate
# 拆解。素材来源（截至 2026-08-20 检索）：
#   1) 2025-08-15 事故：宇树 H1 在一场竞速类赛事的 1500 米项目中，冲刺阶段以
#      3.8 m/s 偏离赛道、撞向场边人员。深度分析文章（OFweek，2025-08）称此前
#      H1 有"2000 小时测试历史"，但"缺乏动态平衡测试、缺乏突发障碍物识别"等
#      关键场景覆盖，根因指向"六轴压力传感器失效"+"碰撞预判/AI 预判模式未能
#      及时反应"。**如实标注不确定性**：具体赛事名称（"双足杯"/"世界人形机器人
#      运动会"）、冲击力精确数值，在不同信源之间表述不完全一致，这里采用能被
#      多信源交叉确认的核心事实（时间、偏离速度、测试覆盖缺口、传感器/软件根因
#      指向），不采用只有单一信源、无法交叉确认的精确数字。
#   2) 2025-05 事故：宇树 H1 在一次工厂/测试场地的测试中，据 TechSpot、
#      Robotics & Automation News 等英文科技媒体报道，机器人因牵引绳张力信号
#      被系统误判为"持续跌倒"，姿态稳定算法不断加码修正，最终剧烈甩动，险些
#      伤及两名在场工作人员。
# 这两起事故之外，2026 年 2-6 月还有多起同类模式的公开事故（天津冬季庙会 H1
# 撞击观众、G1 表演跌倒后甩动击中他人、G1 踢腿动作击中儿童腹部）——这里不逐一
# 建 commit，只用来印证"预设/自主动作在人员密集场景执行、缺乏实时中止机制"
# 这个失败模式不是孤立事件，是重复出现的模式。
#
# 这个 case 存在的目的：验证 4D-CQ 判定框架能不能直接套在一家已上市公司的
# 公开事故记录上——不是假设"如果治理不到位会怎样"，是对着已经发生、已经被
# 报道的真实失败复盘"如果当时有这道门，证据会不会够格"。这本身就是尽调该问
# 的问题：事故之后，这几项证据缺口有没有被实际补上，还是只是舆论平息了。

commits:

  - id: high_speed_track_deviation_human_contact
    name_cn: "高速开放场景运动执行（赛道/表演路径，人员在场）"
    irreversibility: "碰撞已发生即不可逆——人身伤害无法撤销，只能事后处理"
    cost_reverse: inf
    value_tier: high
    cost_fix: 0
    precondition_fn: score_high_speed_track_deviation
    risk_ext:
      p_inspect: 0.3
      loss_if_inspected: 1000
      note: "已是公开事故、已上市公司，后续同类事件被监管/媒体进一步曝光、影响股价与商业化合作的概率不低——代表性量级，不是真实财务估损；这条风险不因为舆论热度过去而清零"

  - id: sensor_ambiguity_stabilization_runaway
    name_cn: "传感器信号矛盾时的姿态修正执行"
    irreversibility: "剧烈甩动一旦发生，物理接触/伤害不可逆，只能事后追责"
    cost_reverse: inf
    value_tier: high
    cost_fix: 0
    precondition_fn: score_sensor_ambiguity_stabilization
