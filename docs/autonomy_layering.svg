<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>四态自主度谱系</title>
<desc>把 PASS/AUTO_REPAIR/ESCALATE/BYPASS_TO_HUMAN 四态排成一条自主度递减、人工介入递增的谱系——判断完成之后，每种结果对应多少自主权、多少人工介入。领域无关引擎与领域相关配置的分层关系见 docs/project_structure.svg，这里不再重复。</desc>
<defs>
<marker id="al-arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B68"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="420" fill="#FFFFFF" stroke="none"/>

<!-- Title -->
<text x="600" y="28" font-size="19" font-weight="700" fill="#2A2A28" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">四态怎么分级自主度</text>
<text x="600" y="48" font-size="11" font-weight="400" fill="#7A7A74" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">How the Four States Grade Autonomy —— 第二张 / Chart 2 of 2</text>

<!-- Section A: autonomy spectrum -->
<text x="80" y="78" font-size="14.5" font-weight="700" fill="#2A2A28" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">四态自主度谱系 · Four-State Autonomy Spectrum</text>

<!-- Seg1 PASS -->
<rect x="80" y="94" width="260" height="130" rx="12" fill="#EAF6EE" stroke="#4E9B66" stroke-width="1.8"/>
<text x="210" y="124" font-size="13.5" font-weight="700" fill="#2F6B44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">PASS</text>
<text x="210" y="142" font-size="10" font-weight="400" fill="#2F6B44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">全自主 / Fully Autonomous</text>
<text x="210" y="158" font-size="9" font-weight="400" fill="#5C5C56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">机器独立完成判定与执行</text>
<text x="210" y="178" font-size="8.8" font-weight="400" fill="#2F6B44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Q(a,E) ≥ τ_pass</text>
<text x="210" y="200" font-size="8" font-weight="400" fill="#7A9A85" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人工介入 = 0 / human involvement = 0</text>

<!-- Seg2 AUTO_REPAIR -->
<rect x="352" y="94" width="260" height="130" rx="12" fill="#FFF3E4" stroke="#D98E3F" stroke-width="1.8" stroke-dasharray="7,4"/>
<text x="482" y="124" font-size="13.5" font-weight="700" fill="#8A5A1E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">AUTO_REPAIR</text>
<text x="482" y="142" font-size="10" font-weight="400" fill="#8A5A1E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">半自主·自我修复 / Semi-Autonomous</text>
<text x="482" y="158" font-size="9" font-weight="400" fill="#5C5C56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">机器自己补证据、重新判定</text>
<text x="482" y="178" font-size="8.8" font-weight="400" fill="#8A5A1E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">τ_repair≤Q&lt;τ_pass ∧ verifiable_ext</text>
<text x="482" y="200" font-size="8" font-weight="400" fill="#A9895C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">内部收敛，不对外暴露为终态</text>

<!-- Seg3 ESCALATE -->
<rect x="624" y="94" width="260" height="130" rx="12" fill="#E5F0FA" stroke="#4C89C8" stroke-width="1.8"/>
<text x="754" y="124" font-size="13.5" font-weight="700" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">ESCALATE</text>
<text x="754" y="142" font-size="10" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人工终审 / Human Sign-off</text>
<text x="754" y="158" font-size="9" font-weight="400" fill="#5C5C56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">机器先判定证据不够，再转人工</text>
<text x="754" y="178" font-size="8.8" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">¬verifiable_ext ∨ Q&lt;τ_repair</text>
<text x="754" y="200" font-size="8" font-weight="400" fill="#7098BC" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人工介入 = 终审一次</text>

<!-- Seg4 BYPASS_TO_HUMAN -->
<rect x="896" y="94" width="260" height="130" rx="12" fill="#F1EEFB" stroke="#7B6CC8" stroke-width="1.8"/>
<text x="1026" y="124" font-size="13.5" font-weight="700" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">BYPASS_TO_HUMAN</text>
<text x="1026" y="142" font-size="10" font-weight="400" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">纯人工 / Fully Human</text>
<text x="1026" y="158" font-size="9" font-weight="400" fill="#5C5C56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">机器从一开始就不参与判断</text>
<text x="1026" y="178" font-size="8.8" font-weight="400" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">bypass_to_human = True</text>
<text x="1026" y="200" font-size="8" font-weight="400" fill="#8B7FB8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人情类证据 / relational evidence</text>

<!-- autonomy gradient arrow -->
<text x="600" y="240" font-size="9.5" font-weight="700" fill="#5C5C56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">自主度递减，人工介入递增 / autonomy decreases, human involvement increases</text>
<path d="M100 252 L1100 252" fill="none" stroke="#9A9A92" stroke-width="1.6" marker-end="url(#al-arrM)"/>

<!-- Synthesis footer tying chart 1 and chart 2 together -->
<rect x="80" y="284" width="1040" height="66" rx="10" fill="#FCEACB" stroke="#C9820A" stroke-width="1.6"/>
<text x="600" y="308" font-size="11" font-weight="700" fill="#7A4A0A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">两张合起来 / Together：第一张（判定链）回答"这个动作现在能不能放行"，第二张（这张）回答"放行结果对应多少自主权、多少人工介入"</text>
<text x="600" y="328" font-size="9.5" font-weight="400" fill="#8A6A1E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">判断的过程和判断完之后的自主度，是同一套系统的两个切面 / the judging process and its resulting autonomy are two faces of one system</text>

<text x="600" y="374" font-size="9.5" font-weight="400" fill="#9A9A92" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">第一张（判定链）：docs/decision_chain.svg · Chart 1 (decision chain)　　领域无关引擎/领域相关配置的完整分层：docs/project_structure.svg</text>
</svg>
