<svg viewBox="0 0 1200 1250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Harness = 何时必须停 + 停下来看什么 + 谁来拍板——判定链与真实实现</title>
<desc>顶部是这套方法论的形式化表达 Commit(a,E) = Human_Gate(a) ∧ ⋀Pᵢ(E,θᵢ)；中段判定链依次为动作分类、可逆性判定 is_commit、证据质量判定 Pᵢ/4D-CQ、人机授权 Human_Gate；底部为完整四态 route 判定式，以及四层真实实现共用同一套判定代码的说明。</desc>
<defs>
<marker id="dc-arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B68"/></marker>
<marker id="dc-arrBl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4C89C8"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="1250" fill="#FFFFFF" stroke="none"/>

