<text x="600" y="118" font-size="10.5" font-weight="400" fill="#8A6A1E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">下面三个节点分别是这套方法论的一个组成部分，全部是可运行代码 / each node below is one component, all running code</text>

