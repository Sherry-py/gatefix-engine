<!-- Component 1: is_commit -->
<rect x="430" y="290" width="340" height="112" rx="12" fill="#F1EEFB" stroke="#7B6CC8" stroke-width="1.8"/>
<rect x="446" y="302" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#7B6CC8" stroke-width="1.2"/>
<text x="481" y="317" font-size="9.5" font-weight="700" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">组成 ①</text>
<text x="620" y="317" font-size="13.5" font-weight="700" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">is_commit(a) 可逆性判定</text>
<text x="600" y="338" font-size="10" font-weight="400" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">从必须承担的不可逆代价反推，找出所有需要闸门的动作点</text>
<text x="600" y="354" font-size="9.5" font-weight="400" fill="#4E4390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">derives every gated action point by working backward from irreversible cost</text>
<text x="600" y="378" font-size="9.5" font-weight="400" fill="#5C4F9E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">IsCommit(a) = [Cost_reverse=∞] ∨ [Cost_reverse&gt;λ·Value(a)]</text>
<text x="790" y="352" font-size="9" font-weight="400" fill="#9A9A92" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">→ gate.py::is_commit()</text>

<path d="M600 402 L600 442" fill="none" stroke="#6B6B68" stroke-width="1.6" marker-end="url(#dc-arrM)"/>

<!-- Component 2: Pi scoring -->
<rect x="430" y="444" width="340" height="112" rx="12" fill="#FDECEE" stroke="#CE5560" stroke-width="1.8"/>
<rect x="446" y="456" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#CE5560" stroke-width="1.2"/>
<text x="481" y="471" font-size="9.5" font-weight="700" fill="#A03B45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">组成 ②</text>
<text x="628" y="471" font-size="13.5" font-weight="700" fill="#A03B45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Pᵢ(E,θᵢ) 证据质量判定</text>
<text x="600" y="491" font-size="10" font-weight="400" fill="#6E6E68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">R/C/O/Ro 四维，确定性代码执行，不是 LLM 判断</text>
<text x="600" y="510" font-size="9.5" font-weight="400" fill="#A03B45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Q(a,E) = w_R·R + w_C·C + w_O·O + w_Ro·Ro</text>
<text x="600" y="532" font-size="8.5" font-weight="400" fill="#B96570" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">7 个打分函数按 case 动态加载 / 7 scoring fns loaded dynamically per case</text>
<text x="790" y="494" font-size="9" font-weight="400" fill="#9A9A92" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">→ preconditions/&lt;case&gt;.py::REGISTRY</text>

<path d="M600 556 L600 596" fill="none" stroke="#6B6B68" stroke-width="1.6" marker-end="url(#dc-arrM)"/>

<!-- Component 3: Human_Gate -->
<rect x="430" y="598" width="340" height="130" rx="12" fill="#E5F0FA" stroke="#4C89C8" stroke-width="1.8"/>
<rect x="446" y="610" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#4C89C8" stroke-width="1.2"/>
<text x="481" y="625" font-size="9.5" font-weight="700" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">组成 ③</text>
<text x="628" y="625" font-size="13.5" font-weight="700" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Human_Gate(a) 人机授权</text>
<text x="600" y="645" font-size="10" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人是否已批准这个动作——独立于证据打分之外的判定项</text>
<text x="600" y="661" font-size="9.5" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">whether a human has approved — independent of evidence scoring</text>
<text x="600" y="679" font-size="9.5" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">LoopMode(a)=IN_THE_LOOP 时必经</text>
<text x="600" y="693" font-size="8.3" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">required whenever LoopMode(a)=IN_THE_LOOP</text>
<text x="600" y="709" font-size="8.3" font-weight="400" fill="#5C86AE" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">决定权不默认交给模型 / authority never defaults to the model</text>
<text x="600" y="723" font-size="9.5" font-weight="400" fill="#2F5E8C" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Human_Gate(a) ∈ {True, False}</text>
<text x="790" y="660" font-size="9" font-weight="400" fill="#9A9A92" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">→ engine.py ESCALATE / BYPASS_TO_HUMAN 分支</text>

