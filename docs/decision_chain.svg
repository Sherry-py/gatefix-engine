<text x="600" y="50" font-size="11" font-weight="400" fill="#7A7A74" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">My Harness = When to Stop + What to Check + Who Decides —— 判定链与真实代码实现 / a methodology mapped to running code</text>

