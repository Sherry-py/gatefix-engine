<text x="790" y="203" font-size="9" font-weight="400" fill="#9A9A92" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">→ mcp_server/server.py 分支①</text>

