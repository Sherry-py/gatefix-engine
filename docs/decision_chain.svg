<text x="185" y="946" font-size="10.5" font-weight="400" fill="#2F6B44" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Q(a,E) ≥ τ_pass —— 全自主放行 / fully autonomous</text>

<rect x="88" y="972" width="1024" height="46" rx="8" fill="#FFF3E4" stroke="#D98E3F" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="108" y="1000" font-size="11.5" font-weight="700" fill="#8A5A1E" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">AUTO_REPAIR</text>
<text x="255" y="1000" font-size="10.5" font-weight="400" fill="#8A5A1E" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">τ_repair ≤ Q &lt; τ_pass ∧ verifiable_ext ∧ dry_rounds &lt; k_dry —— 内部收敛，不对外暴露为终态</text>

<rect x="88" y="1026" width="1024" height="46" rx="8" fill="#E5F0FA" stroke="#4C89C8" stroke-width="1.4"/>
<text x="108" y="1054" font-size="11.5" font-weight="700" fill="#2F5E8C" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">ESCALATE</text>
<text x="225" y="1054" font-size="10.5" font-weight="400" fill="#2F5E8C" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">¬verifiable_ext ∨ dry_rounds≥k_dry ∨ Q&lt;τ_repair —— 转入 Human_Gate 人工终审</text>

<rect x="88" y="1080" width="1024" height="46" rx="8" fill="#F1EEFB" stroke="#7B6CC8" stroke-width="1.6"/>
<text x="108" y="1108" font-size="11.5" font-weight="700" fill="#4E4390" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">BYPASS_TO_HUMAN</text>
<text x="290" y="1108" font-size="10.5" font-weight="400" fill="#4E4390" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">commit.bypass_to_human=True，跳过 Pᵢ —— 人情类证据机器不可组装</text>

